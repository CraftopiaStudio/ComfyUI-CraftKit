[project]
name = "comfyui-craftkit"
description = "Smart resize, batch resize, resolution multiplier and prompt controller nodes for ComfyUI"
version = "1.0.3"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Pillow, NumPy, and PyTorch all ship with ComfyUI itself — intentionally not
# re-declared here to avoid version conflicts with ComfyUI's own pins.
dependencies = []

[project.urls]
Repository = "https://github.com/CraftopiaStudio/ComfyUI-CraftKit"

[tool.comfy]
PublisherId = "craftopiastudio"
DisplayName = "ComfyUI-CraftKit"
Icon = "https://raw.githubusercontent.com/CraftopiaStudio/ComfyUI-CraftKit/main/assets/icon.png"